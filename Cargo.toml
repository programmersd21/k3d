[package]
name = "k3d"
version = "0.1.0"
edition = "2021"
description = "interactive 3d graphics directly in your terminal"
license = "MIT"
repository = "https://github.com/programmersd21/k3d"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
glam = "0.29"
gltf = "1"
png = "0.18"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
